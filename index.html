 outdoor kitchen cost?',k1a:'Outdoor kitchens start at $2,800: a 6-ft island, modular on wheels or permanent, ready to hook up services, with a cooktop, a 22\u00D718 sink with faucet, and the storage of your choice. Stone and panel colors are your pick.',k2q:'Modular or permanent \u2014 what is the difference?',k2a:'The modular kitchen rides on wheels, so you can move it. The permanent one is fixed in place. Both are built with an aluminum frame and stainless-steel doors and equipment, made to live outdoors.',k3q:'Can I finance my kitchen?',k3a:'Yes \u2014 through Lyon Financial and Acorn Finance. Fill the calculator with your exact measurements: that total is your price and the amount to finance, and you can pre-qualify without affecting your credit.',p1q:'What is a 3-inch insulated panel roof?',p1a:'It is an aluminum sandwich panel with a 3-inch insulating core: cooler shade, much less rain noise, and a clean, solid roof look that lasts for years outdoors.',p2q:'Do I need a permit or HOA approval for a pergola?',p2a:'It depends on your city and your HOA. On the free visit we review your specific case with you before anything is signed.',p3q:'What warranty does my pergola carry?',p3a:'Every project comes with a written quote and guaranteed installation: if something about our installation is not right, we come back and make it right.',m1q:'How much does a mailbox cost?',m1a:'Mailboxes start at $450. Our catalog has 8 models from $480 to $720; the exact price depends on the model and finishes you choose.',m2q:'Do you ship outside Houston?',m2a:'Yes \u2014 we already ship to Beaumont, TX. Ask us about your city in the quote form.',m3q:'Can I customize my mailbox?',m3a:'Yes. Beyond the catalog there are custom variants and options \u2014 tell us your idea in the form and we will price it for you.',faqNote:'\u201CFrom\u201D prices are starting points. Your final price is confirmed in writing before you sign, after exact measurements and site conditions are verified on nal delivery — and long after.',visionT:'Our Vision',visionD:'To earn a permanent place in our clients’ phone book: when they need anything we build, we are the first call. And to grow the way family businesses have always grown — through clients so pleased that they recommend us without ever being asked.',v1t:'We listen first',v1d:'Your ideas and opinions matter; we take the time they deserve.',v2t:'Respect & education',v2d:'Every client is treated the way we would treat our own family.',v3t:'Professionalism & ethics',v3d:'Honest guidance, written quotes and guaranteed installation.',v4t:'A lifetime relationship',v4d:'We do not disappear after delivery — we stay one call away.',},es:{navQuote:'Cotizar gratis',procEyebrow:'C\u00D3MO TRABAJAMOS',procTitle:'Nuestro proceso',procDesc:'Del primer mensaje a la entrega final: simple, transparente y con tu precio por escrito.',s1t:'Consulta gratis',s1d:'Cu\u00E9ntanos tu idea por WhatsApp, tel\u00E9fono o el formulario r\u00E1pido. Sin presi\u00F3n y sin compromiso.',s2t:'Dise\u00F1o 3D gratis',s2d:'Ves tu proyecto en 3D antes de construirlo: distribuci\u00F3n, colores, materiales y detalles, todo en pantalla.',s3t:'Estimado en vivo',s3d:'Tu precio al momento con nuestras calculadoras en l\u00EDnea, y despu\u00E9s una visita gratis para verificar las medidas exactas.',s4t:'Instalaci\u00F3n',s4d:'Nuestro propio equipo construye e instala, y te entrega un espacio listo para disfrutar.',procCta:'Empezar mi cotizaci\u00F3n gratis \u2192',procCalc:'Calculadora de cocinas',faqEyebrow:'BUENO SABERLO',faqTitle:'Preguntas frecuentes',faqDesc:'Precios reales de entrada y respuestas directas, por servicio.',gFences:'Cercas de metal \u00B7 DuraFence',gKitchens:'Cocinas exteriores',gPergolas:'P\u00E9rgolas y patios cubiertos',gMailboxes:'Buzones',gCalcF:'Calcula tu cerca ahora \u2192',gCalcK:'Calcula tu cocina ahora \u2192',gQuote:'Pide tu cotizaci\u00F3n \u2192',f1q:'\u00BFCu\u00E1nto cuesta una cerca de metal?',f1a:'Las cercas de metal DuraFence instaladas comienzan en $30 por pie lineal. El precio final depende de la altura, los portones y las condiciones del sitio, y se confirma por escrito tras verificar las medidas en la visita gratis.',f2q:'\u00BFCu\u00E1nto dura una cerca DuraFence?',f2a:'20 a\u00F1os o m\u00E1s con su mantenimiento anual sencillo. El metal no se pudre, no lo atacan las termitas y no se oxida como el acero com\u00FAn.',f3q:'\u00BFEst\u00E1n incluidos los portones?',f3a:'Los portones de hasta 6 ft cuestan $250 cada uno, instalados (sus pies van dentro de los pies lineales). Los portones de 10, 12 o 16 ft se cotizan al medir.',f4q:'\u00BFNecesito permiso o aprobaci\u00F3n de mi HOA?',f4a:'La mayor\u00EDa de las ciudades no exigen permiso para reemplazar una cerca residencial, pero muchas HOA s\u00ED piden aprobaci\u00F3n previa. En la visita gratis revisamos tu caso y te decimos qu\u00E9 aplica.',k1q:'\u00BFCu\u00E1nto cuesta una cocina exterior?',k1a:'Las cocinas exteriores comienzan en $2,800: isla de 6 pies, modular con ruedas o permanente, lista para conectar servicios, con estufa/cooktop, sink 22\u00D718 con faucet y el almacenamiento de tu elecci\u00F3n. La piedra y el color de los paneles los eliges t\u00FA.',k2q:'Modular o permanente: \u00BFcu\u00E1l es la diferencia?',k2a:'La modular va sobre ruedas y la puedes mover. La permanente queda fija. Ambas se construyen con estructura de aluminio y puertas y equipos de acero inoxidable, hechas para vivir a la intemperie.',k3q:'\u00BFPuedo financiar mi cocina?',k3a:'S\u00ED, con Lyon Financial y Acorn Finance. Llena la calculadora con tus medidas exactas: ese total es tu precio y el monto a financiar, y puedes precalificar sin afectar tu cr\u00E9dito.',p1q:'\u00BFQu\u00E9 es el techo de panel insulado de 3 pulgadas?',p1a:'Es un panel s\u00E1ndwich de aluminio con n\u00FAcleo aislante de 3 pulgadas: sombra m\u00E1s fresca, mucho menos ruido de lluvia y un techo de aspecto s\u00F3lido y limpio que dura a\u00F1os a la intempe ar solicitud por correo →',emailNotice:'Este botón abre tu aplicación de correo con la solicitud preparada. No envía ni guarda los datos automáticamente.',footer:'Una división de Legra’s C & D LLC',note:'Fotografía de referencia. Los materiales, medidas, características y disponibilidad deben confirmarse en una cotización escrita.',quote:'Solicitar cotización',back:'Volver a colecciones',subject:'Solicitud de cotización',choose:'Selecciona una categoría',buildYours:'🧑‍🍳 Crea tu propia cocina y tu propio estimado',buildFence:'Crea tu propia cerca y tu propio estimado',getEstimate:'Obtén tu estimado',photo:'Foto',of:'de',whyTitle:'Por qué Legra’s',phEyebrow:'UNA EMPRESA DE FAMILIA',phTitle:'Construimos relaciones, no solo ventas.',phIntro:'Somos una empresa familiar dedicada a productos de exterior de alto standing — y a una forma de vender que pone a la persona primero. En un mundo que vive rápido y espera respuestas inmediatas, nosotros nos mantenemos tradicionales: nos tomamos el tiempo de escuchar, de explicar y de lograr que cada cliente se sienta atendido, respetado y verdaderamente complacido con lo que le entregamos.',missionT:'Nuestra misión',missionD:'Diseñar y construir espacios exteriores de la más alta calidad cuidando a la persona detrás de cada proyecto: escuchar primero, asesorar con honestidad y acompañar a cada cliente desde el primer boceto hasta la entrega final — y mucho después.',visionT:'Nuestra visión',visionD:'Ganarnos un lugar permanente en el libro de llamadas de nuestros clientes: cuando necesiten algo de lo que construimos, ser su primera llamada. Y crecer como siempre han crecido las empresas de familia: con clientes tan complacidos que nos recomiendan sin que tengamos que pedírselo.',v1t:'Escuchamos primero',v1d:'Tus deseos y tus opiniones valen; les dedicamos el tiempo que merecen.',v2t:'Respeto y educación',v2d:'Cada cliente es tratado como tratamos a nuestra propia familia.',v3t:'Profesionalismo y ética',v3d:'Asesoría honesta, cotizac {return p[lang==='en'?'descEn':'descEs']}function render(){document.documentElement.lang=lang;document.title="Legra's Outdoor Systems | "+i18n[lang].collections;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=i18n[lang][el.dataset.i]);['en','es'].forEach(x=>{let b=$(x+'Btn');b.classList.toggle('active',x===lang);b.setAttribute('aria-pressed',String(x===lang))});$('cards').innerHTML=products.map((p,n)=>`<article class="card"><img src="${IMAGES[p.img]}" alt="${title(p)}" loading="lazy" data-open="${p.id}" role="button" aria-label="${title(p)}"><div class="cardbody"><div class="num">COLLECTION ${String(n+1).padStart(2,'0')}</div><h3>${title(p)}</h3><p>${description(p)}</p><button class="btn" type="button" data-open="${p.id}">${i18n[lang].view}</button></div></article>`).join('');const prev=$('product').value;$('product').innerHTML='<option value="">'+i18n[lang].choose+'</option>'+products.map(p=>`<option value="${p.id}">${title(p)}</option>`).join('');$('product').value=prev;if(current)showDetail(current,false)}function showDetail(id,open=true){let p=products.find(x=>x.id===id);if(!p)return;current=id;$('detailImg').src=IMAGES[p.img];$('detailImg').alt=title(p);$('detailNum').textContent='LEGRA’S OUTDOOR SYSTEMS';$('detailTitle').textContent=title(p);$('detailDesc').textContent=description(p);startQuotes(p);const why=p[lang==='en'?'whyEn':'whyEs'];if(why&&why.length){$('detailWhy').style.display='';$('whyTitle').textContent=i18n[lang].whyTitle;$('whyList').innerHTML=why.map(x=>{let i=x.indexOf(': ');if(i>0&&i<70)return '<li><b>'+x.slice(0,i+1)+'</b>'+x.slice(i+1)+'</li>';let w=x.split(' ');return '<li><b>'+w.slice(0,4).join(' ')+'</b> '+w.slice(4).join(' ')+'</li>'}).join('')}else{$('detailWhy').style.display='none'}$('detailNote').textContent=i18n[lang].note;$('detailQuote').textContent=i18n[lang].quote;$('detailBuild').textContent=i18n[lang][id==='kitchens'?'buildYours':id==='fences'?'buildFence':'getEstimate'];$('detailBack').textContent=i18n[lang]. <script>
/* Media dinámica del panel (v3.5): los carruseles leen el manifiesto
   guardado en la Base de Quotes. Si no responde, se quedan las
   fotos que ya trae la página. */
(function(){
  var API = "https://script.google.com/macros/s/AKfycbyfhzsyBcVwpVwXV0t9UfQIexUHCQKr_zMooFHzPofVZgV5usLDXZ77H4R5Sf7wytW0/exec";
  function heroBg(u){
    var st = document.getElementById("inicioHeroCss");
    if (!st) { st = document.createElement("style"); st.id = "inicioHeroCss"; document.head.appendChild(st); }
    st.textContent = '.hero::before{background-image:url(' + JSON.stringify(u) + ')}.heroPhoto{background-image:url(' + JSON.stringify(u) + ')}';
  }
  function applyInicio(d){
    /* Portada desde el manifiesto (v2.1): la sección «inicio» manda.
       inicio[0] = fondo principal (hero) · inicio[1] = banner del logo.
       Si la sección no existe o viene vacía, no se toca nada y la
       página queda EXACTAMENTE como hoy (photo_001.jpg / photo_007.jpg). */
    var ini = d.sections && d.sections.inicio;
    if (!ini || !ini.length) return;
    if (ini[0] && ini[0].u) heroBg(ini[0].u);
    if (ini[1] && ini[1].u) { var lg = document.getElementById("logo"); if (lg) lg.src = ini[1].u; }
  }
  function apply(d){
    if (!d || !d.sections) return;
    applyInicio(d);
    Object.keys(d.sections).forEach(function(k){
      var items = d.sections[k];
      if (items && items.length && typeof COLLECTION_PHOTOS !== "undefined") {
        COLLECTION_PHOTOS[k] = items;
      }
    });
  }
  function jsonp(){
    var cb = "mediaCb" + Math.random().toString(36).slice(2);
    window[cb] = function(d){ try{ delete window[cb]; }catch(e){} s.remove(); apply(d); };
    var s = document.createElement("script");
    s.onerror = function(){ try{ delete window[cb]; }catch(e){} s.remove(); };
    s.src = API + "?action=media&callback=" + cb;
    document.head.appendChild(s);
  }
  if (window.fetch) {
    fetch(API + "?action=media").then(function(r){ return r.json(); }).then(apply).catch(jsonp);
  } else { jsonp(); }
})();
</script>
