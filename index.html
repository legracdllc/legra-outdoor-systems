document.addEventListener('click',e=>{const el=e.target.closest('[data-dot]');if(el)showSlide(Number(el.dataset.dot))});$('carPrev').onclick=()=>showSlide(carIndex-1);$('carNext').onclick=()=>showSlide(carIndex+1);let touchX=null;const carEl=$('cfStage');carEl.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});carEl.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>40)showSlide(carIndex+(dx<0?1:-1))},{passive:true});
function closeDetail(){stopAuto();$('detailDialog').close();current=null}document.addEventListener('click',e=>{let btn=e.target.closest('[data-open]');if(btn)showDetail(btn.dataset.open)});$('closeDialog').onclick=closeDetail;$('detailBack').onclick=closeDetail;const BUILD_LINKS={kitchens:'calculadora-cliente.html',fences:'calculadora-cliente-cercas.html'};$('detailBuild').onclick=()=>{const link=BUILD_LINKS[current];if(link){window.location.href=link;return}$('detailQuote').onclick()};$('detailQuote').onclick=()=>{let id=current;closeDetail();$('product').value=id;$('quote').scrollIntoView({behavior:'smooth'})};$('detailDialog').addEventListener('click',e=>{if(e.target===$('detailDialog'))closeDetail()});$('detailDialog').addEventListener('close',()=>{stopAuto();current=null});const cfEl=$('cfStage');cfEl.addEventListener('pointerdown',()=>{carHold=true});cfEl.addEventListener('pointerup',()=>{carHold=false});cfEl.addEventListener('pointerleave',()=>{carHold=false});cfEl.addEventListener('mouseenter',()=>{carHold=true});cfEl.addEventListener('mouseleave',()=>{carHold=false});$('enBtn').onclick=()=>{lang='en';render()};$('esBtn').onclick=()=>{lang='es';render()};$('quoteForm').addEventListener('submit',e=>{e.preventDefault();if(!e.target.reportValidity())return;const p=products.find(x=>x.id===$('product').value);if(!p)return;const body=[i18n[lang].subject,'',i18n[lang].name+': '+$('name').value,i18n[lang].email+': '+$('email').value,i18n[lang].phone+': '+$('phone').value,i18n[lang].product+': '+title(p),i18n[lang].location+': '+$('location').value,i18n[lang].details+': '+$('details').value].join('\n');window.location.href='mailto:legraosllc@gmail.com?subject='+encodeURIComponent(i18n[lang].subject+' — '+title(p))+'&body='+encodeURIComponent(body)});render();
